name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pre-commit (gitleaks, ruff, shellcheck, hadolint, yaml)
        uses: pre-commit/action@v3.0.1

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=fail2ban docker compose config --quiet

      - name: Validate Caddyfile
        run: |
          for domain in example.com http://localhost; do
            docker run --rm -e DOMAIN="$domain" \
              -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -v /tmp/caddy-logs:/var/log/caddy \
              caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
          docker run --rm -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy fmt /etc/caddy/Caddyfile | diff -u caddy/Caddyfile -

      - name: Test Fail2Ban filters
        run: tests/fail2ban/test_filters.sh

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with random passwords
        run: |
          cp .env.example .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)|" .env
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$(openssl rand -hex 24)|" .env

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: |
          set -x
          curl -fsS http://localhost/example_app/health | grep -q '"ok"'
          curl -fsS http://localhost/example_app/index | grep -q 'mysql'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = 302
          curl -sI http://localhost/example_app/index | grep -qi '^x-content-type-options: nosniff'
          ! curl -sI http://localhost/example_app/index | grep -qi '^server:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/_dashboard)" != 200
          grep -q '"status":200' logs/caddy/access.log

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
